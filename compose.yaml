# =============================================================
#  Kernel Lore Bot — Docker Compose
# =============================================================
services:
  kernel-lore-bot:
    # Deploys pull this image; no source tree is needed on the host. Local
    # development builds it instead, via the build: block in compose.override.yaml.
    image: ghcr.io/tomwhy/kernel-lore-bot:latest
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - bot-state:/app/data

    secrets:
      - telegram_bot_token

    container_name: kernel-lore-bot

    healthcheck:
      test: ["CMD", "pgrep", "-f", "kernel_lore_bot"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token

volumes:
  bot-state:
